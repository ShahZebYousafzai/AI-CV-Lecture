[project]
name = "support-bot"
version = "0.1.0"
description = "Session 31 - Customer support chatbot built with LangChain + Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "streamlit>=1.60.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "support_bot"
module-root = "src"
